# Redis Cluster: 3 primaries + 3 replicas

x-redis-common: &redis-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BASE_IMAGE: redis:7
  image: capbench-redis:local
  cap_add:
    - NET_ADMIN
  entrypoint: ["bash", "/opt/capbench/redis-start.sh"]
  healthcheck: &redis-health
    test: ["CMD", "redis-cli", "ping"]
    interval: 3s
    timeout: 5s
    retries: 40
    start_period: 5s
  networks:
    cap_redis_client_net: {}
    cap_redis_cluster_net: {}

services:
  redis-node1:
    <<: *redis-common
    container_name: redis-node1
    hostname: redis-node1
    environment:
      ANNOUNCE_IP: "172.34.0.11"
    ports:
      - "16379:6379"
    volumes:
      - ./redis-start.sh:/opt/capbench/redis-start.sh:ro
      - ../init/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node1-data:/data
    networks:
      cap_redis_client_net:
        ipv4_address: 172.35.0.11
      cap_redis_cluster_net:
        ipv4_address: 172.34.0.11

  redis-node2:
    <<: *redis-common
    container_name: redis-node2
    hostname: redis-node2
    environment:
      ANNOUNCE_IP: "172.34.0.12"
    ports:
      - "16380:6379"
    volumes:
      - ./redis-start.sh:/opt/capbench/redis-start.sh:ro
      - ../init/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node2-data:/data
    networks:
      cap_redis_client_net:
        ipv4_address: 172.35.0.12
      cap_redis_cluster_net:
        ipv4_address: 172.34.0.12

  redis-node3:
    <<: *redis-common
    container_name: redis-node3
    hostname: redis-node3
    environment:
      ANNOUNCE_IP: "172.34.0.13"
    ports:
      - "16381:6379"
    volumes:
      - ./redis-start.sh:/opt/capbench/redis-start.sh:ro
      - ../init/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node3-data:/data
    networks:
      cap_redis_client_net:
        ipv4_address: 172.35.0.13
      cap_redis_cluster_net:
        ipv4_address: 172.34.0.13

  redis-node4:
    <<: *redis-common
    container_name: redis-node4
    hostname: redis-node4
    environment:
      ANNOUNCE_IP: "172.34.0.14"
    ports:
      - "16382:6379"
    volumes:
      - ./redis-start.sh:/opt/capbench/redis-start.sh:ro
      - ../init/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node4-data:/data
    networks:
      cap_redis_client_net:
        ipv4_address: 172.35.0.14
      cap_redis_cluster_net:
        ipv4_address: 172.34.0.14

  redis-node5:
    <<: *redis-common
    container_name: redis-node5
    hostname: redis-node5
    environment:
      ANNOUNCE_IP: "172.34.0.15"
    ports:
      - "16383:6379"
    volumes:
      - ./redis-start.sh:/opt/capbench/redis-start.sh:ro
      - ../init/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node5-data:/data
    networks:
      cap_redis_client_net:
        ipv4_address: 172.35.0.15
      cap_redis_cluster_net:
        ipv4_address: 172.34.0.15

  redis-node6:
    <<: *redis-common
    container_name: redis-node6
    hostname: redis-node6
    environment:
      ANNOUNCE_IP: "172.34.0.16"
    ports:
      - "16384:6379"
    volumes:
      - ./redis-start.sh:/opt/capbench/redis-start.sh:ro
      - ../init/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-node6-data:/data
    networks:
      cap_redis_client_net:
        ipv4_address: 172.35.0.16
      cap_redis_cluster_net:
        ipv4_address: 172.34.0.16

  redis-init:
    image: capbench-redis:local
    container_name: redis-init
    entrypoint: ["bash", "/init/01_create_cluster.sh"]
    restart: "on-failure"
    depends_on:
      redis-node1:
        condition: service_healthy
      redis-node2:
        condition: service_healthy
      redis-node3:
        condition: service_healthy
      redis-node4:
        condition: service_healthy
      redis-node5:
        condition: service_healthy
      redis-node6:
        condition: service_healthy
    volumes:
      - ../init/redis/01_create_cluster.sh:/init/01_create_cluster.sh:ro
    networks:
      cap_redis_cluster_net:
        ipv4_address: 172.34.0.20

networks:
  cap_redis_cluster_net:
    name: cap_redis_cluster_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.34.0.0/16
  cap_redis_client_net:
    name: cap_redis_client_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.35.0.0/16

volumes:
  redis-node1-data:
  redis-node2-data:
  redis-node3-data:
  redis-node4-data:
  redis-node5-data:
  redis-node6-data:
