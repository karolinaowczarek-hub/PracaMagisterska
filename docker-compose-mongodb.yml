version: '3.8'

services:
  mongo1:
    image: mongo:6.0
    container_name: mongo-primary
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    networks:
      - mongo_net

  mongo2:
    image: mongo:6.0
    container_name: mongo-replica1
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27018:27017"
    networks:
      - mongo_net

  mongo3:
    image: mongo:6.0
    container_name: mongo-replica2
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27019:27017"
    networks:
      - mongo_net

networks:
  mongo_net:
    driver: bridge